<head>

<body>
    <main>
        <h1>Graphical Method – Minimization</h1>

            <div class="scroll">
<div class="row">Problem: <input class="n" id="ttl" style="width:260px"></div>

        </section>
        <div id="out"></div>

        <script src="script.js"></script>
    </main>
